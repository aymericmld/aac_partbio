[project]
name = "aac-partbio"
version = "2.0.0"
description = "Cultures et part du bio sur les aires d'alimentation de captage (RPG IGN x CartoBio x AAC Sandre)"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pandas>=2.2", "psycopg[binary]>=3.1", "openpyxl"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
prefiltre = ["pyogrio", "shapely", "geopandas"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
